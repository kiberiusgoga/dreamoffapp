name: CI

# Replaces the previous FTP workflow, which uploaded only ./dist to cPanel.
# The API was never deployed by it, so the published site had a frontend and
# no backend. Deployment now belongs to the Node host's own git integration,
# building from the Dockerfile; this workflow is the gate in front of it.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Lint
        run: npm run lint

      - name: Typecheck frontend
        run: npx tsc -p tsconfig.json --noEmit

      - name: Typecheck server
        run: npx tsc --noEmit
        working-directory: server

      # The suite creates its own temp database per file, so it needs no
      # services and no secrets. See test/server-setup.ts.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Catches a Dockerfile that cannot build before the host discovers it
      # mid-deploy. No push, no registry credentials.
      - name: Build the image
        run: docker build -t dreamoff:ci .

      # Only the SVGs are compared. They are generated text and therefore
      # deterministic; PNG bytes are not, because libvips builds differ
      # between this runner and whoever last ran the generator.
      - name: Check the icon vectors match their generator
        run: |
          npm run icons
          if ! git diff --quiet -- 'public/*.svg'; then
            echo "public/*.svg differs from what generate-icons.mjs produces."
            git --no-pager diff -- 'public/*.svg'
            exit 1
          fi
          git checkout -- public
