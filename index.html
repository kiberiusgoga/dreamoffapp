<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <!-- .ico first for the crawlers and readers that fetch /favicon.ico by
         path; the SVG wins in every browser that understands it and stays
         sharp at any density. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/mask-icon.svg" color="#BFA76F" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) resolve to real
         values on notched phones; without it the bottom nav sits under the
         home indicator. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="DreamOff — record your dreams and read them through Jungian, Freudian, cognitive and other interpretive frameworks." />
    <title>DreamOff</title>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
